<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://earth-connect-assets.pages.dev" crossorigin>
  <link rel="icon" href="/src/assets/favicon.svg" type="image/svg+xml">
  <title>Earth Connect</title>
  <style>
    html{background:#000;color:#f7f9ff}
    #initial{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#000;font:14px/1.5 system-ui,sans-serif;text-align:center}
    #root:not(:empty)+#initial{display:none}
    #initial div{width:min(100%,420px);opacity:0;transition:opacity 260ms ease-out}
    #initial[data-visible] div{opacity:1}
    #initial p{margin:0;color:#f7f9ff}
  </style>
</head>
<body>
  <div id="root"></div>
  <main id="initial"><div><p id="initial-status" role="status"></p></div></main>
  <script type="module" src="/src/workspace/pagesBootstrap.ts"></script>
</body>
</html>
