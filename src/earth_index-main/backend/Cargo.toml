[package]
name = "earth-index-api"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
axum = { version = "0.8.9", features = ["http2"] }
chrono = "0.4"
duckdb = { version = "=1.20000.2", features = ["vscalar", "vscalar-arrow"] }
futures-util = "0.3"
prost = "0.14"
prost-types = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tonic = { version = "0.14.9", features = ["gzip"] }
tonic-prost = "0.14.9"
tonic-reflection = "0.14.9"
tonic-web = "0.14.9"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-prost-build = "0.14.9"

[dev-dependencies]
flate2 = "1"
http-body-util = "0.1"

[profile.release]
strip = true
lto = "thin"
