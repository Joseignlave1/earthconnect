app = "earth-index-crisrpia"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  API_LISTEN = "0.0.0.0:8080"
  DUCKDB_PATH = "/data/earth.duckdb"
  DUCKDB_THREADS = "4"
  DUCKDB_MEMORY_LIMIT = "5GB"
  STATEMENT_TIMEOUT_MS = "0"
  MAX_RESPONSE_BYTES = "134217728"
  # The hosted root opens the demo. grpcui remains a local developer tool.
  GRPCUI_URL = "/demo/"

[[mounts]]
  source = "earth_data"
  destination = "/data"
  initial_size = "10gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [http_service.http_options]
    h2_backend = true

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "performance"
  cpus = 4
  memory = "8gb"

# Do not restart an idle Machine that Fly Proxy deliberately stopped.
[[restart]]
  policy = "on-failure"
  retries = 3
